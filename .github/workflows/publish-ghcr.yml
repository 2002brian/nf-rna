name: Publish GHCR execution image

on:
  release:
    types: [published]

# A GitHub Release publication is the only authority to publish an official
# image. This workflow cannot backfill images for historical source releases.
permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, validate, and publish release image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify release version and checkout
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Official GHCR publication requires a stable vX.Y.Z release tag." >&2
            exit 1
          fi
          package_version="$(python3 - <<'PY'
          import ast
          from pathlib import Path

          module = ast.parse(Path("src/rnaseq/__init__.py").read_text(encoding="utf-8"))
          versions = [
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              for target in node.targets
              if isinstance(target, ast.Name) and target.id == "__version__"
          ]
          if len(versions) != 1 or not isinstance(versions[0], str):
              raise SystemExit("Could not read one literal package __version__.")
          print(versions[0])
          PY
          )"
          expected_version="${RELEASE_TAG#v}"
          test "$package_version" = "$expected_version"
          release_revision="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          checkout_revision="$(git rev-parse HEAD)"
          test "$checkout_revision" = "$release_revision"
          {
            echo "version=$package_version"
            echo "sha=$release_revision"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.release.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          build-args: |
            NF_RNA_SOURCE_REVISION=${{ steps.release.outputs.sha }}

      - name: Smoke test published image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.release.outputs.version }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE" rnaseq --version | grep -Fx "$EXPECTED_VERSION"
