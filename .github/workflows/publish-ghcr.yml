name: Publish GHCR execution image

on:
  release:
    types: [published]

# A GitHub Release publication is the only authority to publish an official
# image. A later workflow change therefore cannot backfill an image for a
# historical release, and the registry guard below prevents tag replacement.
permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, validate, and publish release image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Validate release identity
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          checked_out_revision="$(git rev-parse HEAD)"
          python3 tools/ghcr_release.py release-info \
            --tag "$RELEASE_TAG" \
            --package-version-file src/rnaseq/__init__.py \
            --resolve-tag \
            --checkout-revision "$checked_out_revision" \
            --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Refuse to replace an existing release image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ steps.release.outputs.container_version }}
        run: |
          set -euo pipefail
          python3 tools/ghcr_release.py registry-check \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$IMAGE_TAG" \
            --username "$GITHUB_ACTOR"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.release.outputs.container_version }}
            type=raw,value=latest,enable=${{ steps.release.outputs.stable }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.container_version }}

      - name: Build release image for validation
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            NF_RNA_SOURCE_REVISION=${{ steps.release.outputs.sha }}

      - name: Validate the exact image to be published
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
          CONTAINER_VERSION: ${{ steps.release.outputs.container_version }}
          SOURCE_REVISION: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          python3 tools/ghcr_release.py validate-image \
            --image "$IMAGE" \
            --expected-package-version "$PACKAGE_VERSION" \
            --expected-container-version "$CONTAINER_VERSION" \
            --expected-revision "$SOURCE_REVISION"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish validated image tags
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          STABLE: ${{ steps.release.outputs.stable }}
          LATEST_IMAGE: ghcr.io/${{ github.repository }}:latest
        run: |
          set -euo pipefail
          # Push the immutable version first; only then may stable latest move.
          docker push "$IMAGE"
          if [[ "$STABLE" == "true" ]]; then
            docker push "$LATEST_IMAGE"
          fi
