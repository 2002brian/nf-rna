name: PPI offline contracts

on:
  push:
    branches: [v1.8.0]
    paths:
      - 'src/rnaseq/ppi*.py'
      - 'tests/test_ppi*.py'
      - '.github/workflows/ppi.yml'
  pull_request:
    paths:
      - 'src/rnaseq/ppi*.py'
      - 'tests/test_ppi*.py'
      - '.github/workflows/ppi.yml'

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify candidate preparation and STRING network contracts
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_ppi*.py' -v
